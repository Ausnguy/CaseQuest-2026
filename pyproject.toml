[project]
name = "casequest"
version = "0.1.0"
description = "CaseQuest 2026 - Lone Mesa Energy downtime analysis and prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0",
    "openpyxl>=3.1",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casequest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
